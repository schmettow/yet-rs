name: CI

on:
  push:
  pull_request:

permissions:
  contents: read

env:
  CARGO_TERM_COLOR: always
  RUSTDOCFLAGS: -D warnings

jobs:
  test:
    name: test (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]

    steps:
      - uses: actions/checkout@v4

      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy

      - uses: Swatinem/rust-cache@v2

      - run: cargo fmt --all --check

      - run: cargo check --workspace --all-targets --all-features --locked

      - run: cargo test --workspace --all-features --locked

      - run: cargo clippy --workspace --all-targets --all-features --locked -- -D warnings

      - run: cargo doc --workspace --no-deps --all-features --locked

  msrv:
    name: MSRV 1.95
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - uses: dtolnay/rust-toolchain@1.95.0

      - uses: Swatinem/rust-cache@v2

      - run: cargo check --workspace --all-targets --locked

  nostd:
    name: no_std guard (Cortex-M)
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: thumbv7em-none-eabi, thumbv6m-none-eabi

      - uses: Swatinem/rust-cache@v2

      - run: cargo check -p yet-gaze --target thumbv7em-none-eabi --all-features --locked

      - run: cargo check -p yet-gaze --target thumbv6m-none-eabi --all-features --locked
