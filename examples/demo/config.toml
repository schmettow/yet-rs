# Demo experiment for `yet-app plan`.

[display]
presenter_monitor = 1
console_monitor = 0
width = 1440
height = 2560
fullscreen = true

[camera]
# The Yet camera is the GEMBIRD/AppoTech UVC device on /dev/video2.
# It exposes YUYV only and sustained ~26 fps in the SPK-5 measurement.
usb_index = 2
width = 640
height = 480
fps = 30
format = "yuyv"
# Centered half-frame; adjust to the eye position of the Yet camera.
eye_region = [0.25, 0.25, 0.5, 0.5]

[presenter]
backend = "egui"
overlay = "auto"

[overlay]
monitor = 1

[audio]
enabled = true
device = "default"
volume = 0.8
