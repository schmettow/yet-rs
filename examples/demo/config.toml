# Demo experiment for `yet-zero plan`.

[display]
# Zero-based: 1 is the second monitor (labelled "2" in the console).
presenter_monitor = 1
console_monitor = 0
width = 1440
height = 2560
fullscreen = true

[camera]
# The Yet camera is the GEMBIRD/AppoTech UVC device on /dev/video2.
# It exposes YUYV only and sustained ~26 fps in the SPK-5 measurement.
usb_index = 2
width = 640
height = 480
fps = 30
format = "yuyv"
# 2:1 eye frame, 90% of the frame width, centered; edit live in Adjust.
eye_region = [0.05, 0.275, 0.9, 0.45]

[presenter]
backend = "egui"
overlay = "auto"

[overlay]
monitor = 1

[audio]
enabled = true
device = "default"
volume = 0.8
