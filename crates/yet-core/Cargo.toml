[package]
name = "yet-core"
description = "UI-free experiment engine and eye-tracking core for yet-rs"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
authors.workspace = true
repository.workspace = true
publish.workspace = true

[dependencies]
yet-present.workspace = true
yet-gaze.workspace = true
thiserror.workspace = true
serde.workspace = true
toml.workspace = true
csv.workspace = true
nalgebra.workspace = true
image.workspace = true

[target.'cfg(target_os = "linux")'.dependencies]
linuxvideo = "0.3.5"

[target.'cfg(target_os = "macos")'.dependencies]
nokhwa = { version = "0.10.11", default-features = false, features = ["input-avfoundation"] }

[target.'cfg(target_os = "windows")'.dependencies]
nokhwa = { version = "0.10.11", default-features = false, features = ["input-msmf"] }

[dev-dependencies]
tempfile = "3"

[lints]
workspace = true
