# SPDX-License-Identifier: GPL-3.0-only

[package]
name = "yet-core"
description = "Abstract, no_std gaze-tracking essentials for yet-rs"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
authors.workspace = true
repository.workspace = true
readme = "README.md"
keywords = ["eye-tracking", "gaze", "no-std", "embedded", "computer-vision"]
categories = ["science", "computer-vision", "no-std", "embedded"]

[dependencies]
thiserror = { version = "2", default-features = false }
nalgebra = { version = "0.34", default-features = false, features = [
    "alloc",
    "libm",
], optional = true }
libm = { version = "0.2", optional = true }

[features]
default = []
yet-zero = ["dep:nalgebra", "dep:libm"]

[dev-dependencies]
csv = "1"
serde = { version = "1", features = ["derive"] }
tempfile = "3"

[lints]
workspace = true
