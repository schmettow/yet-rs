# SPDX-License-Identifier: GPL-3.0-only

[package]
name = "yet-app"
description = "Binary entry point for yet-rs"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
authors.workspace = true
repository.workspace = true
publish.workspace = true

[dependencies]
yet-core.workspace = true
yet-present.workspace = true
thiserror.workspace = true
eframe = { version = "0.33", default-features = false, features = [
    "default_fonts",
    "wgpu",
    "x11",
    "wayland",
] }
# Feature unification: eframe's `wgpu` feature does not enable a wgpu backend
# with default features off. egui-wgpu's defaults enable wgpu/default.
egui-wgpu = { version = "0.33", default-features = true }

[dev-dependencies]
tempfile = "3"

[lints]
workspace = true
