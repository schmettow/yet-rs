# SPDX-License-Identifier: GPL-3.0-only

[workspace]
members = [
    "crates/yet-core",
    "crates/yet-stim",
    "crates/yet-egui",
    "crates/yet-zero",
]
exclude = ["spikes"]
resolver = "2"

[workspace.package]
version = "0.1.0"
edition = "2021"
rust-version = "1.95"
license = "GPL-3.0-only"
authors = ["Martin Schmettow <schmettow@web.de>"]
repository = "https://github.com/schmettow/yet-rs"

[workspace.dependencies]
yet-core = { version = "0.1.0", path = "crates/yet-core" }
yet-stim = { version = "0.1.0", path = "crates/yet-stim" }
yet-egui = { version = "0.1.0", path = "crates/yet-egui" }
thiserror = "2"
serde = { version = "1", features = ["derive"] }
toml = "0.8"
csv = "1"
nalgebra = "0.34"
image = { version = "0.25.10", default-features = false, features = ["jpeg", "png"] }
hound = "3.5"
rodio = { version = "0.23", default-features = false, features = ["playback"] }
eframe = { version = "0.37", default-features = false, features = [
    "default_fonts",
    "wgpu",
    "x11",
    "wayland",
] }

[workspace.lints.rust]
unsafe_code = "forbid"
