# SPDX-License-Identifier: GPL-3.0-only

[workspace]
members = ["crates/yet-present", "crates/yet-core", "crates/yet-app"]
exclude = ["spikes"]
resolver = "2"

[workspace.package]
version = "0.1.0"
edition = "2021"
rust-version = "1.88"
license = "GPL-3.0-only"
authors = ["Martin Schmettow <schmettow@web.de>"]
repository = "https://github.com/schmettow/yet-rs"
publish = false

[workspace.dependencies]
yet-present = { path = "crates/yet-present" }
yet-core = { path = "crates/yet-core" }
thiserror = "2"
serde = { version = "1", features = ["derive"] }
toml = "0.8"
csv = "1"
nalgebra = "0.34"
image = { version = "0.25.10", default-features = false, features = ["jpeg", "png"] }

[workspace.lints.rust]
unsafe_code = "forbid"
