# Minimal Sway session for yet-rs.
#
# Prefer the launcher, which fills in the paths and output names:
#
#   tools/run-naked.sh /path/to/experiment --console-output DP-1 --presenter-output DP-3
#
# This file is the template. You can also copy it, edit the values below and
# start it directly from a TTY:
#
#   sway -c /path/to/sway-yet.conf
#
# The presenter output is fullscreen; the console stays on the other output.
# No bar, background service or notification daemon is started. XWayland is
# disabled so no foreign clients or overlays can appear.

set $mod Mod4
set $console_output DP-1
set $presenter_output DP-3

# Quiet defaults.
default_border none
default_floating_border none
gaps inner 0
gaps outer 0
seat * hide_cursor 1000
focus_follows_mouse no
xwayland disable

# Replace with the names reported by `swaymsg -t get_outputs`.
# The launcher replaces the two `set` lines above and the `exec` line below.
output $console_output resolution 2560x1600 position 0,662
output $presenter_output resolution 1440x2560 position 2560,0

# Optional: a solid background needs swaybg. Without it Sway shows black.
# output * bg #000000 solid_color

# Yet-rs window placement. The app_id values are set by the presenter and console.
# The overlay is a layer-shell surface and needs no window rule.
for_window [app_id="yet-rs-console"] move to output $console_output
for_window [app_id="yet-rs-presenter"] fullscreen enable, move to output $presenter_output

# Keep a way out and a way to reload after config edits.
bindsym $mod+Shift+e exit
bindsym $mod+Shift+r reload
bindsym $mod+Return exec foot

# Replaced by tools/run-naked.sh. When editing this file by hand, use absolute
# paths and quote them if they contain spaces.
exec /path/to/yet-rs/target/release/yet-zero run /path/to/experiment --participant pilot01
