[package]
name = "spk4-media"
version = "0.1.0"
edition = "2021"
publish = false

[dependencies]
hound = "3.5"
image = { version = "0.25", default-features = false, features = ["png"] }

[dependencies.rodio]
version = "0.23"
default-features = false
features = ["playback"]
optional = true

[features]
rodio = ["dep:rodio"]

[[bin]]
name = "playback"
path = "src/bin/playback.rs"
required-features = ["rodio"]
